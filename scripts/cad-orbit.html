<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}} · CAD</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0e161d;color:#e9f1f3;font:16px/1.5 system-ui}main{max-width:76rem;margin:auto;padding:1.3rem}h1{font-size:clamp(1.6rem,4vw,3rem);margin:.2rem 0}p{margin:.35rem 0 1rem}figure{margin:0;position:relative;border:1px solid #546772;background:#0e161d}canvas,img{width:100%;height:min(62vh,42rem);display:block;object-fit:contain}canvas{touch-action:none;cursor:grab}canvas:active{cursor:grabbing}[hidden]{display:none}button{color:inherit;background:#223940;border:1px solid #627d88;border-radius:.3rem;padding:.45rem .8rem;font:inherit}nav{display:flex;gap:.5rem;margin:.7rem 0}a{color:#a2dbed}small{color:#afc4cd}
</style>
<main><h1>{{title}}</h1><p>{{scope}}</p>
<figure><img id="poster" src="assembly.png" alt="{{title}} rendered from the source CAD"><canvas tabindex="0" aria-label="Orbit the CAD assembly. Arrow keys rotate, plus and minus zoom, Home resets." hidden></canvas></figure>
<nav aria-label="Camera"><button id="reset">Reset view</button><button id="closer">Zoom in</button><button id="farther">Zoom out</button></nav>
<p id="status" role="status">Loading assembly…</p><small>{{facts}} · <a href="receipt.json">CAD export record</a></small></main>
<script id="packed" type="application/octet-stream">{{mesh}}</script>
<script type="module">
const canvas = document.querySelector('canvas');
const status = document.querySelector('#status');
async function start() {
  const gl = canvas.getContext('webgl',{antialias:true});
  if (!gl) throw Error('WebGL unavailable');
  const packed = Uint8Array.from(atob(document.querySelector('#packed').textContent.trim()), c=>c.charCodeAt(0));
  const stream = new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'));
  const view = new DataView(await new Response(stream).arrayBuffer());
  const count = view.getUint32(80,true);
  if (!count || view.byteLength !== 84+50*count) throw Error('Invalid mesh');
  const vertices = new Float32Array(count*18);
  const bounds = {{bounds}};
  const center = [0,2,4].map(i=>(bounds[i]+bounds[i+1])/2);
  const radius = Math.hypot(...[0,2,4].map(i=>(bounds[i+1]-bounds[i])/2));
  for (let i=0; i<count; i++) {
    const offset=84+i*50;
    for(let j=0;j<3;j++) for(let k=0;k<3;k++) {
      vertices[18*i+6*j+k]=(view.getFloat32(offset+12+12*j+4*k,true)-center[k])/radius;
      vertices[18*i+6*j+3+k]=view.getFloat32(offset+4*k,true);
    }
  }
  const program=gl.createProgram();
  function attach(type,src) {
    const shader=gl.createShader(type); gl.shaderSource(shader,src); gl.compileShader(shader);
    if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS)) throw Error('Shader compilation failed');
    gl.attachShader(program,shader);
  }
  attach(gl.VERTEX_SHADER,'attribute vec3 p,n; uniform mat3 basis; uniform vec2 scale; varying float light; void main(){vec3 v=basis*p; vec3 normal=normalize(basis*n); light=.32+.68*abs(dot(normal,normalize(vec3(-.4,.65,.7)))); gl_Position=vec4(v.xy*scale,-.85*v.z,1.);}');
  attach(gl.FRAGMENT_SHADER,'precision mediump float; varying float light; void main(){gl_FragColor=vec4(vec3(.63,.8,.87)*light,1.);}');
  gl.linkProgram(program);
  if(!gl.getProgramParameter(program,gl.LINK_STATUS)) throw Error('Shader linking failed');
  gl.useProgram(program); gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER,vertices,gl.STATIC_DRAW);
  for(const [name,offset] of [['p',0],['n',12]]) {
    const loc=gl.getAttribLocation(program,name); gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc,3,gl.FLOAT,false,24,offset);
  }
  const basis=gl.getUniformLocation(program,'basis'), scale=gl.getUniformLocation(program,'scale');
  let yaw,tilt,zoom,drag;
  function draw() {
    const w=Math.max(1,Math.round(canvas.clientWidth*Math.min(devicePixelRatio,2)));
    const h=Math.max(1,Math.round(canvas.clientHeight*Math.min(devicePixelRatio,2)));
    if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
    gl.viewport(0,0,w,h); gl.enable(gl.DEPTH_TEST); gl.clearColor(.055,.085,.115,1);
    gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    const a=Math.cos(yaw),b=Math.sin(yaw),c=Math.cos(tilt),d=Math.sin(tilt);
    gl.uniformMatrix3fv(basis,false,[-b,-a*d,a*c,a,-b*d,b*c,0,c,d]);
    gl.uniform2f(scale,zoom*Math.min(1,h/w),zoom*Math.min(1,w/h));
    gl.drawArrays(gl.TRIANGLES,0,count*3);
  }
  function reset(){yaw=-.89;tilt=.45;zoom=.98;draw();}
  function size(factor){zoom=Math.max(.2,Math.min(7,zoom*factor));draw();}
  function rotate(x,y){yaw+=x;tilt=Math.max(-1.56,Math.min(1.56,tilt+y));draw();}
  canvas.onpointerdown=e=>{canvas.focus();canvas.setPointerCapture(e.pointerId);drag=[e.pointerId,e.clientX,e.clientY];};
  canvas.onpointermove=e=>{if(drag?.[0]===e.pointerId){rotate((drag[1]-e.clientX)*.009,(e.clientY-drag[2])*.009);drag=[e.pointerId,e.clientX,e.clientY];}};
  canvas.onlostpointercapture=()=>{drag=null;};
  canvas.addEventListener('wheel',e=>{e.preventDefault();size(Math.exp(-.0015*e.deltaY));},{passive:false});
  canvas.onkeydown=e=>{const keys={ArrowLeft:()=>rotate(-.15,0),ArrowRight:()=>rotate(.15,0),ArrowUp:()=>rotate(0,.15),ArrowDown:()=>rotate(0,-.15),'+':()=>size(1.2),'=':()=>size(1.2),'-':()=>size(1/1.2),Home:reset};if(keys[e.key]){e.preventDefault();keys[e.key]();}};
  document.querySelector('#reset').onclick=reset;document.querySelector('#closer').onclick=()=>size(1.25);
  document.querySelector('#farther').onclick=()=>size(.8);
  document.querySelector('#poster').hidden=true;canvas.hidden=false;reset();
  new ResizeObserver(draw).observe(canvas);
  status.textContent='Drag or use the arrow keys to rotate. Scroll or use the buttons to zoom.';
}
start().catch(e=>{status.textContent='Showing the CAD still. '+e.message+'.';document.querySelector('nav').hidden=true;});
</script></html>
