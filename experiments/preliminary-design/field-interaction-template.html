<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R3 field interactions</title>
<style>
:root{--bg:#f2f5f7;--ink:#14212b;--muted:#4a5a66;--panel:#ffffff;--line:#c9d3da;--blue:#1d4f91;--gold:#e6b450;--pass:#1f7a4d;--fail:#b3261e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1820;--ink:#e6edf2;--muted:#9fb0bc;--panel:#16222c;--line:#2c3c48;--blue:#7fb0ff;--gold:#e6b450;--pass:#5fd39a;--fail:#ff8a80}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Segoe UI,sans-serif}
main{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2rem 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
select,button{font:inherit;padding:4px 8px}
input[type=range]{flex:1;min-width:160px}
canvas{width:100%;height:auto;background:#0f1820;border-radius:6px;display:block}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.pass{color:var(--pass);font-weight:700}.fail{color:var(--fail);font-weight:700}
small,.muted{color:var(--muted)}
ul{padding-left:1.1rem;margin:.3rem 0}
code{font-size:.85em;word-break:break-all}
</style>
</head>
<body>
<main>
<h1>R3 field interactions</h1>
<div class="muted" id="head"></div>
<div class="bar">
 <label>Trial <select id="trial"></select></label>
 <button id="play">Play</button>
 <input id="time" type="range" min="0" max="0" value="0" aria-label="Trial time">
 <span id="clock">0.000 s</span>
</div>
<div class="grid">
 <div><canvas id="view" width="900" height="560" aria-label="Side view of the trial"></canvas>
  <p class="muted" id="legend"></p></div>
 <div class="card" id="info"></div>
</div>
<div class="card" style="margin-top:14px" id="notes"></div>
</main>
<script type="application/json" id="data">TRIAL_DATA</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const sel=document.getElementById('trial'),range=document.getElementById('time'),clock=document.getElementById('clock');
const cv=document.getElementById('view'),g=cv.getContext('2d');
document.getElementById("head").textContent=`Issue ${D.issue} · layout ${D.layout.sha256.slice(0,12)} · trace ${D.trace.sha256.slice(0,12)} · ${D.solver}`;
D.trials.forEach((t,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${t.passed?'PASS':'FAIL'} · ${t.name}`;sel.appendChild(o)});
let T=D.trials[0],playing=false,last=0;
const views={acquisition:[0.25,-0.03,0.85,0.48],delivery:[-3.5,-0.05,0.3,2.25],elevation:[-0.55,-0.08,0.75,0.88]};
function frame(){return T.frames[+range.value]||T.frames[0]}
function W(x,z){const v=views[T.kind],s=Math.min(cv.width/(v[2]-v[0]),cv.height/(v[3]-v[1]));return[(x-v[0])*s,cv.height-(z-v[1])*s,s]}
function line(a,b,c,w){g.strokeStyle=c;g.lineWidth=w||2;g.beginPath();g.moveTo(...W(...a).slice(0,2));g.lineTo(...W(...b).slice(0,2));g.stroke()}
function circ(x,z,r,c,fill){const[p,q,s]=W(x,z);g.beginPath();g.arc(p,q,r*s,0,7);if(fill){g.fillStyle=c;g.fill()}else{g.strokeStyle=c;g.lineWidth=2;g.stroke()}}
function rect(x0,z0,x1,z1,c,fill){const[a,b]=W(x0,z1),[p,q]=W(x1,z0);if(fill){g.fillStyle=c;g.fillRect(a,b,p-a,q-b)}else{g.strokeStyle=c;g.lineWidth=2;g.strokeRect(a,b,p-a,q-b)}}
function trace(ix,iz,c){g.strokeStyle=c;g.lineWidth=1.5;g.setLineDash([4,4]);g.beginPath();T.frames.slice(0,+range.value+1).forEach((f,i)=>{const[p,q]=W(f[ix],f[iz]);i?g.lineTo(p,q):g.moveTo(p,q)});g.stroke();g.setLineDash([])}
function draw(){
 g.fillStyle='#0f1820';g.fillRect(0,0,cv.width,cv.height);
 const f=frame(),R=0.075057;
 line([-5,0],[5,0],'#5c6b77',2);
 if(T.kind==='acquisition'){
  const G=T.geometry;rect(G.bumper[0],G.bumper[1],G.bumper[2],G.bumper[3],'#2358A2',true);
  rect(G.beltBackX,G.pulley[1],G.pulley[0]+G.pulley[2],G.topPulley[1],'#007F78',false);
  circ(G.pulley[0],G.pulley[1],G.pulley[2],'#007F78');circ(G.topPulley[0],G.topPulley[1],G.topPulley[2],'#007F78');circ(G.roller[0],G.roller[1],G.roller[2],'#007F78');
  line([0.314,0.0699],[0.34,0.0699],'#496A81',6);
  trace(1,2,'#e6b450');circ(f[1],f[2],R,'#e6b450',true);
  const a=f[3]*f[0];line([f[1],f[2]],[f[1]+R*Math.cos(a),f[2]+R*Math.sin(a)],'#14212b',2);
 }else if(T.kind==='delivery'){
  const h=T.hub,ins=Math.cos(Math.PI/6)*Math.hypot(h.hex[0][0]-h.center[0],h.hex[0][1]-h.center[1]);
  rect(h.center[0]-h.half,0,h.center[0]-ins,1.777,'#8A9199',true);rect(h.center[0]+ins,0,h.center[0]+h.half,1.777,'#8A9199',true);
  rect(h.center[0]-h.half,1.779,h.center[0]-ins,1.8288,'#2358A2',true);rect(h.center[0]+ins,1.779,h.center[0]+h.half,1.8288,'#2358A2',true);
  rect(h.center[0]-ins,0.99,h.center[0]+ins,1.0,'#8A9199',true);
  line([h.center[0]-ins,T.params.sensorZ],[h.center[0]+ins,T.params.sensorZ],'#D55E00',2);
  rect(-0.4175,0.048,0.4175,0.75,'#496A81',false);
  trace(1,3,'#e6b450');circ(f[1],f[3],R,'#e6b450',true);
 }else{
  const ux=T.uprightX;rect(ux,0.0095,ux+0.0889,0.9,'#8A9199',true);rect(0.4179,0,1,0.008,'#8A9199',true);
  circ(T.rung[0],T.rung[1],T.rung[2],'#c0c8cf',true);
  const [_,x,z,th,s,ten]=f,cg=T.params.cg;
  const P=(px,pz)=>{const cx=px-cg[0],cz=pz-cg[1];return[x+cg[0]+cx*Math.cos(th)-cz*Math.sin(th),z+cg[1]+cx*Math.sin(th)+cz*Math.cos(th)]};
  const poly=(pts,c,fill)=>{g.beginPath();pts.map(p=>W(...P(...p))).forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();if(fill){g.fillStyle=c;g.fill()}else{g.strokeStyle=c;g.lineWidth=2;g.stroke()}};
  poly([[-0.4175,0.048],[0.4175,0.048],[0.4175,0.168],[-0.4175,0.168]],'#2358A2',true);
  poly([[-0.34,0.0699],[0.34,0.0699],[0.34,0.715],[-0.34,0.715]],'#496A81',false);
  [[0.265,0.0381],[-0.265,0.0381]].forEach(w=>{const p=P(...w);circ(p[0],p[1],0.0381,'#29333B',true)});
  line(P(0.300,0.30),P(0.300,0.7084-s),'#007F78',4);line(P(0.289,0.7084-s),P(0.513,0.7084-s),'#007F78',5);line(P(0.501,0.7084-s),P(0.501,0.6804-s),'#007F78',5);
  const cgw=P(cg[0],cg[1]);circ(cgw[0],cgw[1],0.012,'#e6b450',true);
 }
 clock.textContent=`${f[0].toFixed(3)} s`+(T.kind==='elevation'?` · hook stroke ${(f[4]*1000).toFixed(1)} mm · cable ${f[5].toFixed(0)} N`:'');
}
function info(){
 const m=T.metric,ev=T.events.map(e=>`<li><b>${e.t.toFixed(3)} s</b> ${e.event}</li>`).join('');
 const p=Object.entries(T.params).map(([k,v])=>`${k}=${Array.isArray(v)?v.join(','):v}`).join(' · ');
 document.getElementById('info').innerHTML=`<div class="${T.passed?'pass':'fail'}">${T.passed?'PASS':'FAIL'}</div>
 <p><b>${m.name}:</b> ${m.value===null?'not reached':m.value}<br><small>Requirement: ${m.requirement}</small></p>
 ${T.firstUnmet?`<p><b>First unmet condition:</b> ${T.firstUnmet}</p>`:''}
 <p><b>Imposed:</b> ${T.imposed}<br><b>Solved:</b> ${T.solved}</p>
 ${T.beltDemand?`<p><b>Belt demand:</b> ${T.beltDemand.maxNormalN} N peak normal, ${T.beltDemand.maxFrictionPowerW} W peak friction power. <small>${T.beltDemand.note}</small></p>`:''}
 ${T.limits?`<p><b>Limits:</b> ${T.limits}</p>`:''}
 <p><b>Events</b></p><ul>${ev}</ul><p><small>${p}</small></p>`;
 document.getElementById('legend').textContent={acquisition:'Side view at the front bumper (robot frame, metres). Blue: bumper. Teal: belt module, pulleys and top roller. Gold: the free FUEL and its trace; the black tick shows its spin.',
 delivery:'Side view through the HUB (shot-pose frame, metres). Grey: HUB body and cavity floor. Blue: top plate and opening edges. Orange: assumed sensor plane. Gold: the free FUEL and its trace.',
 elevation:'Side view at the berth (metres). Grey: upright face, TOWER BASE. Light circle: low rung. Blue: bumper. Teal: hook and inner tube. Gold dot: centre of mass.'}[T.kind];
}
function load(){T=D.trials[+sel.value];range.max=T.frames.length-1;range.value=0;info();draw()}
sel.onchange=load;range.oninput=draw;
document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'Pause':'Play';last=performance.now();if(playing)requestAnimationFrame(tick)};
function tick(now){if(!playing)return;const f=T.frames,dt=(now-last)/1000;last=now;let i=+range.value;const target=f[i][0]+dt*(T.kind==='delivery'?0.5:0.5);while(i<f.length-1&&f[i][0]<target)i++;range.value=i;draw();if(i>=f.length-1){playing=false;document.getElementById('play').textContent='Play';return}requestAnimationFrame(tick)}
document.getElementById('notes').innerHTML=`<b>Scenario and evidence</b><ul>${D.scenarioNotes.map(n=>`<li>${n}</li>`).join('')}</ul>
<p><small>Layout <code>${D.layout.file}</code> ${D.layout.sha256} · rules <code>${D.rules.file}</code> ${D.rules.sha256} · trace <code>${D.trace.file}</code> ${D.trace.sha256}. Playback runs at half speed. No frame here is a commanded illustration: every position comes from the integrated trial.</small></p>`;
load();
</script>
</body>
</html>
