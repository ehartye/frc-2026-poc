<title id="title">Bumper anchor section and battery sled mounting drawing</title>
<desc id="details">Section through the side rail shows the bumper angle and centered vertical cap screw. An underside plan shows the four battery sled fasteners around the supported cart platform. Dimensions in millimetres; diagrams are not at the same scale.</desc>
