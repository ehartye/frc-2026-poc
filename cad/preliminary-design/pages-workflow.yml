name: Preliminary design review
on:
  push:
    branches: [main]
    paths: ['docs/**', 'cad/preliminary-design/stage.py', '.github/workflows/preliminary-review.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: preliminary-review-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Each release is a preliminary design release. --check-index refuses any release without a
      # layout-checked receipt, matching digests and a mission-task case for a represented objective.
      # A combined site that also serves a detailed showcase deploys through its mechanical model eligibility gate
      # instead, with this tree registered under preliminaryReleases; the detailed model stays the primary view.
      - run: python cad/preliminary-design/stage.py --check-index
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: docs
      - id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
