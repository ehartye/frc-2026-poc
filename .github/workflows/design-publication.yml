name: Design publication
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
env:
  # The one plugin pin: a release tag or full commit of ehartye/agent-frc. Change it by pull request.
  AGENT_FRC_REF: c376a0d71c36a0aacfc950d66b59fef9d045b792 # Agent FRC 0.120.0
  # The interpreter and CAD kernel the layout check runs with. Keep them at the versions the project checks with locally.
  PYTHON_VERSION: '3.13'
  OCP_VERSION: 8.0.1.0.0
  NUMPY_VERSION: 2.5.3
jobs:
  scan:
    name: Paths and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ehartye/agent-frc
          ref: ${{ env.AGENT_FRC_REF }}
          path: plugin
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      # A personal machine path or a credential is public as soon as the branch is pushed, with or without a pull request.
      - run: node plugin/scripts/branch-scan.mjs project

  check:
    name: Design publication
    runs-on: ubuntu-latest
    # Room for several designs at the per-design budget below, as after a change to the pins above.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: project
          fetch-depth: 0
          persist-credentials: false
          # Set lfs: true when a STEP or Fusion archive is stored with Git LFS.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ehartye/agent-frc
          ref: ${{ env.AGENT_FRC_REF }}
          path: plugin
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install "cadquery-ocp==$OCP_VERSION" "numpy==$NUMPY_VERSION"
      # A rerun that passed is kept by the digest of its input files and the plugin version, so an unchanged design is not rerun.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/layout-check
          key: layout-check-${{ env.AGENT_FRC_REF }}-py${{ env.PYTHON_VERSION }}-ocp${{ env.OCP_VERSION }}-np${{ env.NUMPY_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: layout-check-${{ env.AGENT_FRC_REF }}-py${{ env.PYTHON_VERSION }}-ocp${{ env.OCP_VERSION }}-np${{ env.NUMPY_VERSION }}-
      # Rerun the layout check for each in-progress or effective design from its committed inputs, compare it with the
      # committed receipt, compare the review's numbers with the receipt and check the status index.
      - name: Check the published designs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          args=()
          # A feature branch reruns only the designs it changes. The default branch and a manual run check every
          # design against the cache, so a rerun that failed there is repeated until it passes.
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            if base=$(git -C project merge-base "origin/$DEFAULT_BRANCH" HEAD 2>/dev/null); then args+=(--base "$base"); fi
          fi
          node plugin/scripts/design-publication.mjs check project --cache "$RUNNER_TEMP/layout-check" --budget-minutes 45 "${args[@]}"
      # Keep each rerun that passed even when another design or a later step fails.
      - if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/layout-check
          key: layout-check-${{ env.AGENT_FRC_REF }}-py${{ env.PYTHON_VERSION }}-ocp${{ env.OCP_VERSION }}-np${{ env.NUMPY_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
      # The project's own evidence regressions, registered in tests/ci.json.
      - name: Run the project's registered checks
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then base=$(git -C project merge-base "origin/$DEFAULT_BRANCH" HEAD 2>/dev/null || true); fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || -z "$base" || "$base" =~ ^0+$ ]] || ! git -C project merge-base --is-ancestor "$base" HEAD; then
            node plugin/scripts/project-checks.mjs project full
          else
            node plugin/scripts/project-checks.mjs project changed "$base"
          fi

  # The site is built, not served from docs/: the season's original showcase builder writes the field, rehearsal and
  # robot pages, then the preliminary design releases are added under preliminary-design/.
  build:
    name: Site build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: project
          persist-credentials: false
      - name: Get the showcase builder that issued the field pages
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ehartye/agent-frc
          ref: 1751f86b5bf69305b775415991cf48191549b53d # Agent FRC 0.48.2
          path: builder
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build the public showcase
        run: node project/scripts/build-showcase.mjs builder "$RUNNER_TEMP/showcase"
      - name: Add the preliminary design releases under preliminary-design/
        run: |
          cp -r project/docs/preliminary-design "$RUNNER_TEMP/showcase/preliminary-design"
          python - "$RUNNER_TEMP/showcase/index.html" <<'PY'
          import sys
          page = sys.argv[1]
          text = open(page, encoding="utf-8").read()
          anchor = '<a href="field-lab.html">Open the field lab</a>'
          if text.count(anchor) != 1:
              raise SystemExit("Expected one field lab link on the season index")
          text = text.replace(anchor, anchor + ' <a href="preliminary-design/">Preliminary design</a>')
          open(page, "w", encoding="utf-8", newline="").write(text)
          PY
      - name: Replay role, architecture, load and replenishment studies
        run: python project/experiments/role-and-support/review.py builder "$RUNNER_TEMP/method-results"
      - name: Exercise terminal replay controls on phone and desktop
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/showcase" >"$RUNNER_TEMP/showcase-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node project/scripts/check-tower-playback.mjs http://127.0.0.1:8765/ google-chrome
      - if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ runner.temp }}/showcase

  deploy:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [scan, check, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency:
      group: design-publication-pages
      cancel-in-progress: false
    steps:
      - id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
