name: Project CI
# This workflow belongs to the project. It checks out the project and nothing else, and runs only the project's own
# files: the path and secret scan and the site check under scripts/ci/, then the project's own tests. On the default
# branch it then publishes the docs folder, as committed, to GitHub Pages. It runs no design check: a design is checked
# before it is pushed.
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Scan and site check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # Set lfs: true when a published file is stored with Git LFS.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.14'
      # A personal machine path or a credential is public as soon as the branch is pushed.
      - name: Scan for personal paths and secrets
        run: node scripts/ci/scan.mjs .
      # Every listed design has its folder, every named file is there and every relative link leads somewhere.
      - name: Check the published site
        run: node scripts/ci/site-check.mjs docs
      # The project's own tests. Each runs a file of this repository and nothing else.
      - name: Check that each README still names the current design
        run: python3 scripts/cad-readmes.py .
      - name: Check the selected kickoff strategy
        run: node scripts/check-strategy.mjs
      - name: Check the six-robot rehearsal evidence
        run: node scripts/check-match-series.mjs
      - name: Check the pinned legacy sources
        run: python3 -m unittest discover -s tests
      - name: Open the entry page and the field lab on phone and desktop
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory docs >"$RUNNER_TEMP/site-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/check-site-pages.mjs http://127.0.0.1:8765/ google-chrome
      # The published site is the docs folder as committed. Nothing is built.
      - if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: docs

  deploy:
    name: Publish the site
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
