name: Robot showcase
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    uses: ./.github/workflows/project-evidence.yml

  build:
    needs: evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: project
          persist-credentials: false
      - name: Get the reviewed showcase builder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ehartye/agent-frc
          ref: 1751f86b5bf69305b775415991cf48191549b53d # v0.48.2
          path: builder
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build the registered public showcase
        run: node project/scripts/build-showcase.mjs builder "$RUNNER_TEMP/showcase"
      - name: Get the preliminary release checker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ehartye/agent-frc
          ref: 78f092e263049cee3843659d3bf56525a41734f7 # Agent FRC 0.93.0
          path: preliminary-tools
          persist-credentials: false
      - name: Add the checked preliminary design releases under preliminary-design/
        run: |
          python project/cad/preliminary-design/stage.py --check-index
          node preliminary-tools/scripts/preliminary-release.mjs verify project/docs/preliminary-design/releases/layout-001
          cp -r project/docs/preliminary-design "$RUNNER_TEMP/showcase/preliminary-design"
          # The one secondary, work-in-progress link the preliminary release class admits on the season index.
          python - "$RUNNER_TEMP/showcase/index.html" <<'PY'
          import sys
          page = sys.argv[1]
          text = open(page, encoding="utf-8").read()
          anchor = '<a href="field-lab.html">Open the field lab</a>'
          if text.count(anchor) != 1:
              raise SystemExit("Expected one field lab link on the season index")
          text = text.replace(anchor, anchor + ' <a href="preliminary-design/">Preliminary design (work in progress)</a>')
          open(page, "w", encoding="utf-8", newline="").write(text)
          PY
      - name: Replay role, architecture, load and replenishment studies
        run: python project/experiments/role-and-support/review.py builder "$RUNNER_TEMP/method-results"
      - name: Exercise terminal replay controls on phone and desktop
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/showcase" >"$RUNNER_TEMP/showcase-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node project/scripts/check-tower-playback.mjs http://127.0.0.1:8765/ google-chrome
      - name: Hand the final output to an isolated verification runner
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-showcase
          path: ${{ runner.temp }}/showcase
          include-hidden-files: true
          if-no-files-found: error

  mechanical:
    name: Mechanical model eligibility
    env:
      FRC_REQUIRE_ACTIVE_MODEL_SELECTION: "true"
      FRC_ACTIVE_MODEL_SELECTION: ${{ vars.FRC_ACTIVE_MODEL_SELECTION }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the candidate source for static comparison
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: project
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the approved public presentation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 9ce4168a2bea21e0fcea97455460bca070620fda
          path: approved
          persist-credentials: false
      - name: Get the original field and presentation builder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ehartye/agent-frc
          ref: 1751f86b5bf69305b775415991cf48191549b53d
          path: builder
          persist-credentials: false
      - name: Verify the mechanical reviewer has an immutable release
        env:
          RELEASE: ${{ vars.AGENT_FRC_PLUGIN_SHA }}
        run: '[[ "$RELEASE" =~ ^[0-9a-f]{40}$ ]]'
      - name: Get the separately reviewed private-issue verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ehartye/agent-frc
          ref: ${{ vars.AGENT_FRC_PLUGIN_SHA }}
          path: verifier
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Download the exact output produced by the project publisher
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-showcase
          path: ${{ runner.temp }}/showcase
      - name: Reproduce the full approved showcase and the independently generated rehearsal
        run: |
          set -euo pipefail
          # The pinned role generator records root-relative project input paths in its downloadable role selection.
          # Both independent builds use the same portable directory layout as the approved hosted edition.
          approved_root="$RUNNER_TEMP/frozen-layout"
          approved_project="$approved_root/frc-2026-poc/frc-2026-poc/project"
          mkdir -p "$(dirname "$approved_project")" "$approved_root/_temp"
          cp -a approved "$approved_project"
          (cd "$approved_root" && node "$approved_project/scripts/build-showcase.mjs" "$GITHUB_WORKSPACE/builder" "_temp/showcase")
          mv "$approved_root/_temp/showcase" "$RUNNER_TEMP/approved"
          field_root="$RUNNER_TEMP/rehearsal-layout"
          bridge="$field_root/frc-2026-poc/frc-2026-poc/project"
          mkdir -p "$bridge"
          for script in kickoff/rehearsal/{build,profile,check-match}.mjs experiments/role-and-support/{replay-lanes,peer-lanes}.mjs; do
            install -D -m 0644 "approved/$script" "$bridge/$script"
          done
          for data in kickoff/rules-model.json experiments/depot-loading/stock-register.json experiments/role-and-support/study.json kickoff/rehearsal/match-summary.json kickoff/field-lab.html; do
            test "$(git -C project ls-tree HEAD -- "$data" | cut -f 1 | cut -d ' ' -f 1)" = '100644'
            mkdir -p "$bridge/$(dirname "$data")"
            git -C project show "HEAD:$data" > "$bridge/$data"
          done
          (cd "$field_root" && node "$bridge/kickoff/rehearsal/build.mjs" "$GITHUB_WORKSPACE/builder" "_temp/showcase")
          mv "$field_root/_temp/showcase" "$RUNNER_TEMP/field"
      - name: Check the source inventory and every final public byte
        env:
          REVIEW_PUBLIC_KEY: ${{ vars.MECHANICAL_REVIEW_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/verification.json" <<'JSON'
          {
            "schema": "agent-frc/local-showcase-release@1",
            "layout": "built",
            "approvedCommit": "9ce4168a2bea21e0fcea97455460bca070620fda",
            "sourcePolicy": ".github/public-model-policy.json",
            "stagePolicy": ".github/staged-model-policy.json",
            "approvedSite": "approved",
            "approvedSiteSha256": "e5e7c3bc2082e87a91e651ccc310cb850bab136e4ac193f6ecdc619fa46d64d8",
            "sourcePacket": ".github/model-release/source.json",
            "stagePacket": ".github/model-release/staged.json",
            "independentFieldRoot": "field",
            "reviewerPublicKey": "mechanical-review-public.pem"
          }
          JSON
          if [[ -n "$REVIEW_PUBLIC_KEY" ]]; then
            printf '%s\n' "$REVIEW_PUBLIC_KEY" > "$RUNNER_TEMP/mechanical-review-public.pem"
          fi
          node --input-type=module -e "import {selectActive, verifyCurrent} from './verifier/scripts/public-model-release.mjs'"
          node verifier/scripts/local-showcase-release.mjs check "$RUNNER_TEMP/verification.json" project "$RUNNER_TEMP/showcase"
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/showcase

  deploy:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: mechanical
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency:
      group: robot-showcase-pages
      cancel-in-progress: false
    steps:
      - id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
