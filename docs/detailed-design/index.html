<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detailed designs</title>
<style>
:root{--ink:#16202b;--muted:#566473;--paper:#f6f4ef;--card:#fff;--line:#d5d0c5;--go:#1d6b4f;--work:#8a5a00;--old:#5b6470;--warn:#9c2f1f}
@media (prefers-color-scheme:dark){:root{--ink:#e9edf2;--muted:#a3afbd;--paper:#11161c;--card:#1a222b;--line:#33404d;--go:#6fd0a8;--work:#f0bd5e;--old:#a3afbd;--warn:#ff9a86}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:60rem;margin:0 auto;padding:1.5rem 1rem 3rem}
h1{font-size:1.6rem;margin:0 0 .25rem}
h2{font-size:1.05rem;margin:2rem 0 .5rem;color:var(--muted);font-weight:600}
.lead{color:var(--muted);margin:0 0 1.5rem}
.pair{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:.5rem;padding:1rem}
.card h3{margin:.25rem 0;font-size:1.2rem;overflow-wrap:anywhere}
.status{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.effective .status{color:var(--go)}.in-progress .status{color:var(--work)}.superseded .status,.withdrawn .status{color:var(--old)}
.primary{border-width:2px;border-color:var(--go)}.primary.in-progress{border-color:var(--work)}
.note{margin:.5rem 0 0;color:var(--muted);font-size:.92rem}
.warning{margin:.5rem 0 0;color:var(--warn);font-weight:600;font-size:.92rem}
ul{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
a{color:inherit}
</style>
</head>
<body>
<main>
<h1>Detailed designs</h1>
<p class="lead">The effective detailed design passed the mechanical-readiness review and was accepted in a reviewed change. An in-progress design passed its automated layout and mission checks and is still changing.</p>
<section id="current" class="pair" aria-live="polite"><p>Loading the design index.</p></section>
<h2 id="archive-title" hidden>Archive</h2>
<ul id="archive"></ul>
</main>
<script>
const labels={'in-progress':'In-progress detailed design',effective:'Effective detailed design',superseded:'Superseded detailed design',withdrawn:'Withdrawn detailed design'};
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
function card(index,id,primary){
  const status=index.designStatus[id],box=el(primary===undefined?'li':'article','card '+status+(primary?' primary':''));
  box.append(el('span','status',labels[status]),el('h3','',id));
  const link=index.preliminary?.[id];
  if(status==='in-progress'){
    const a=el('a','','Open the checked motion and mission cases');a.href='designs/'+encodeURIComponent(id)+'/';
    const line=el('p','note');line.append(a);box.append(line);
  }
  if(status==='effective')box.append(el('p','note','Shown on the project entry page, README still and model selector.'));
  if(link)box.append(el('p','note','Built on preliminary release '+link+'.'));
  const linked=link&&(status==='in-progress'||status==='effective')&&index.preliminaryStatus?index.preliminaryStatus(link):'effective';
  if(linked!=='effective')box.append(el('p','warning','Preliminary release '+link+' is now '+linked+'. This design needs re-linking to the effective preliminary release.'));
  if(index.supersededBy?.[id])box.append(el('p','note','Superseded by '+index.supersededBy[id]+'.'));
  if(index.reason?.[id])box.append(el('p','note','Withdrawn: '+index.reason[id]+(index.lastCommit?.[id]?' Its files are in the repository history at commit '+index.lastCommit[id].slice(0,12)+'.':'')));
  return box;
}
const json=url=>fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json();});
json('designs.json').then(async index=>{
  // The re-link warning is read live from the preliminary release index.
  const releases=await json(String(index.preliminaryIndex||'')).catch(()=>null);
  if(releases)index.preliminaryStatus=id=>releases.designStatus?.[id]??'in-progress';
  const current=document.getElementById('current'),archive=document.getElementById('archive');
  current.replaceChildren();
  if(index.current)current.append(card(index,index.current,true));
  if(index.beside)current.append(card(index,index.beside,false));
  if(!index.current){
    const box=el('article','card');
    box.append(el('h3','','No detailed design is published'));
    const a=el('a','','Open the current preliminary design');
    a.href=String(index.preliminaryIndex||'').replace(/releases\.json$/,'');
    const line=el('p','note');line.append(a);box.append(line);
    current.append(box);
  }
  const shown=new Set([index.current,index.beside]);
  const rest=index.designs.filter(id=>!shown.has(id)).reverse();
  document.getElementById('archive-title').hidden=!rest.length;
  archive.replaceChildren(...rest.map(id=>card(index,id)));
}).catch(()=>{document.getElementById('current').textContent='The design index could not be loaded.';});
</script>
</body>
</html>
